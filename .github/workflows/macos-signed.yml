name: Signed macOS build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: kurv-signed-macos
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and notarize KURV
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Restore pinned path dependencies
        uses: ./.github/actions/restore-build-inputs
        with:
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN }}

      - name: Install pinned Rust toolchain and cargo-truce
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.97.1 --profile minimal --component rust-src --no-self-update
          rustup target add --toolchain 1.97.1 \
            aarch64-apple-darwin x86_64-apple-darwin
          cargo +1.97.1 install cargo-truce --version 6.3.0 --locked
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Build, sign, notarize, and staple
        env:
          APPLE_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-macos-signed.sh

      - name: Upload signed macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kurv-macos-signed
          path: target/macos-release
          if-no-files-found: error
          retention-days: 30
