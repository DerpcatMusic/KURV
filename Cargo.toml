[package]
name = "pure_va_dispersion_core"
version = "0.8.0"
edition = "2024"
authors = ["Prototype Lab"]
license = "ISC"
homepage = "https://example.com/pure-va-dispersion-core"
description = "Fast procedural virtual-analog synthesizer."

[lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unused = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[workspace]
resolver = "3"

[patch.crates-io]
truce-loader = { path = "vendor/truce-loader-6.3.0" }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "kurv-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "standalone"]
clap = ["dep:clap-sys", "dep:truce-clap"]
vst3 = ["dep:truce-vst3"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
atomic-wait = "=1.1.0"
clap-sys = { version = "0.5", optional = true }
egui = "=0.34.1"
egui-phosphor = "=0.12.0"
plugcat = { path = "vendor/plugcat", default-features = false, features = ["egui"] }
serde_json = "1"
smallvec = "=1.15.2"
truce = "=6.3.0"
truce-clap = { version = "=6.3.0", optional = true }
truce-core = "=6.3.0"
truce-egui = "=6.3.0"
truce-standalone = { version = "=6.3.0", features = ["gui"], optional = true }
truce-simd = "=6.3.0"
truce-vst3 = { version = "=6.3.0", optional = true }
wide = "=0.7.33"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 2
debug = 0

[profile.dev.package.pure_va_dispersion_core]
opt-level = 3
codegen-units = 1

[profile.shell]
inherits = "release"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
