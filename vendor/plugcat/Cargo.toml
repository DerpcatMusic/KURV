[package]
name = "plugcat"
version = "0.1.3"
edition = "2024"
license = "ISC"
publish = false
description = "Shared plugin UI framework helpers for Derpcat audio plugins"

[features]
default = ["egui"]
egui = ["dep:egui034", "dep:egui_extras034", "dep:egui_taffy034"]
serde = ["dep:serde"]

[dependencies]
egui034 = { package = "egui", version = "=0.34.1", features = ["default_fonts"], optional = true }
egui_extras034 = { package = "egui_extras", version = "=0.34.1", default-features = false, features = ["svg"], optional = true }
egui_taffy034 = { package = "egui_taffy", version = "0.12.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
